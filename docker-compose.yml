name: task-board

services:
  task-board:
    image: ghcr.io/your-github-username/zimaos-taskboard:latest
    network_mode: bridge
    ports:
      - target: 8080
        published: "8189"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
    environment:
      PORT: "8080"
      DATA_DIR: /data
    container_name: task-board
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_US: "Task Board web UI"
      volumes:
        - container: /data
          description:
            en_US: "Task board data (tasks, people, activity log)"
    labels:
      icon: "https://raw.githubusercontent.com/your-github-username/zimaos-taskboard/main/icon.svg"

x-casaos:
  id: org.tbolt.taskboard
  architectures:
    - amd64
    - "386"
    - arm64
    - arm
  main: task-board
  author: tbolt
  category: Productivity
  description:
    en_US: A lean, local-first task board. Add tasks with quick-add syntax (#tags, +subtasks, due dates), assign people, track progress, and get a weekly digest. Data lives on your NAS.
  developer: tbolt
  icon: "https://raw.githubusercontent.com/your-github-username/zimaos-taskboard/main/icon.svg"
  screenshot_link:
    - "https://raw.githubusercontent.com/your-github-username/zimaos-taskboard/main/screenshot-1.png"
  tagline:
    en_US: Your task board, self-hosted
  thumbnail: "https://raw.githubusercontent.com/your-github-username/zimaos-taskboard/main/thumbnail.svg"
  tips:
    before_install:
      en_US: |
        ## Task Board

        Data (tasks, people, activity log) is stored on your ZimaOS disk at `/DATA/AppData/task-board/`, so it survives container rebuilds and is shared across every browser on your network.
  title:
    en_US: Task Board
  index: /
  port_map: "8080"
  version: "1.0.0"
  update_at: "2026-08-03"
  release_notes:
    en_US: |-
      - Initial release: self-hosted task board with on-NAS storage.
  website: "https://github.com/your-github-username/zimaos-taskboard"
  repo: "https://github.com/your-github-username/zimaos-taskboard"
  support: "https://github.com/your-github-username/zimaos-taskboard/issues"
